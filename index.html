<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Boxicons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="./assets/css/styles.css">

    <title>Məlumatların Bərpası</title>
</head>

<body class="bg-blue-50">

    <!-- Header Section -->
    <header class="custom-header hidden lg:flex items-center justify-between px-12 py-6 bg-blue-800">
        <nav class="flex items-center gap-8">
            <a href="#" class="text-white hover:text-blue-400 font-semibold">Ana Səhifə</a>
            <a href="#" class="text-white hover:text-blue-400 font-semibold">Haqqımızda</a>
            <a href="#" class="text-white hover:text-blue-400 font-semibold">Xidmətlər</a>
        </nav>

        <div class="flex gap-5">
            <a href="#" class="text-white hover:text-blue-400 font-semibold">AZ</a>
            <a href="#" class="text-white hover:text-blue-400 font-semibold">RU</a>
            <a href="#" class="text-white hover:text-blue-400 font-semibold">EN</a>
        </div>
    </header>

    <!-- Mobile Navbar -->
    <div class="mobile-navbar flex lg:hidden items-center justify-between px-6 py-4 bg-blue-800">
        <i id="menu-toggle" class="bx bx-menu text-white text-3xl cursor-pointer"></i>
        <div class="flex gap-4">
            <a href="#" class="text-white hover:text-blue-400 font-semibold">AZ</a>
            <a href="#" class="text-white hover:text-blue-400 font-semibold">RU</a>
            <a href="#" class="text-white hover:text-blue-400 font-semibold">EN</a>
        </div>
    </div>

    <!-- Mobile Menu-->
    <nav id="mobile-menu" class="hidden lg:hidden bg-white shadow-md p-4 transition-all duration-300">
        <a href="#" class="block py-2 text-blue-800 font-semibold hover:text-blue-600">Ana Səhifə</a>
        <a href="#" class="block py-2 text-blue-800 font-semibold hover:text-blue-600">Haqqımızda</a>
        <a href="#" class="block py-2 text-blue-800 font-semibold hover:text-blue-600">Xidmətlər</a>
    </nav>

    <!-- Mobile Header with Logo -->
    <div class="bg-white py-[53px] px-6 shadow-lg lg:hidden flex items-center justify-between">
        <div class="flex items-center gap-6">
            <h4 class="text-3xl font-semibold tracking-wide text-blue-600">Data <span class="text-blue-800">Recovery</span></h4>
        </div>
        <button class="flex items-center gap-3 px-3 py-2 bg-blue-600 text-white hover:bg-blue-700 transition-all rounded-lg">
            <img src="./assets/images/candy-box.svg" alt="candy-box-icon" class="w-8 h-8">
            <span class="font-semibold text-xl">Xidmətlər</span>
        </button>
    </div>

    <!-- Services Section -->
    <section class="bg-white p-8 shadow-lg hidden lg:flex items-center justify-between">
        <div class="flex items-center gap-4">
            <h4 class="text-3xl font-semibold tracking-wide text-blue-600">Data <span class="text-blue-800">Recovery</span></h4>
        </div>

        <div class="grid md:grid-cols-3 lg:grid-cols-4 gap-12 text-center">
            <div class="p-6 rounded-lg hover:bg-blue-100 transition-all">
                <i class='bx bx-mobile-alt text-5xl text-blue-600'></i>
                <p class="mt-4 font-semibold text-lg">iPhone məlumatların bərpası</p>
            </div>
            <div class="p-6 rounded-lg hover:bg-blue-100 transition-all">
                <i class='bx bx-chip text-5xl text-blue-600'></i>
                <p class="mt-4 font-semibold text-lg">SSD məlumatların bərpası</p>
            </div>
            <div class="p-6 rounded-lg hover:bg-blue-100 transition-all">
                <i class='bx bx-hdd text-5xl text-blue-600'></i>
                <p class="mt-4 font-semibold text-lg">HDD məlumatların bərpası</p>
            </div>
            <div class="p-6 rounded-lg hover:bg-blue-100 transition-all">
                <i class='bx bx-server text-5xl text-blue-600'></i>
                <p class="mt-4 font-semibold text-lg">RAID məlumatların bərpası</p>
            </div>
        </div>
    </section>

    <script>
        document.getElementById("menu-toggle").addEventListener("click", function () {
            let mobileMenu = document.getElementById("mobile-menu");
            mobileMenu.classList.toggle("hidden");

            // Səhifənin kaymasını bloklamaq üçün
            if (!mobileMenu.classList.contains("hidden")) {
                document.body.classList.add("overflow-hidden");
            } else {
                document.body.classList.remove("overflow-hidden");
            }
        });
    </script>

</body>
</html>
