<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Boxicons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css">
    <link rel="stylesheet" href="./assets/css/styles.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <title>Məlumatların Bərpası</title>
</head>
<body class="bg-white">
    
    <!-- Header Section -->
    <header class="custom-header hidden lg:flex flex items-center justify-center px-10 py-3 h-[41px]">
        <!-- Navigation Links -->
        <nav class="flex items-center gap-6">
            <a href="#" class="text-white hover:text-blue-600 font-semibold">Ana Səhifə</a>
            <a href="#" class="text-white hover:text-blue-600 font-semibold">Haqqımızda</a>
            <a href="#" class="text-white hover:text-blue-600 font-semibold">Xidmətlər</a>
        </nav>
        
        <!-- Language Selector -->
        <div class="flex gap-3 absolute right-4 top-2">
            <a href="#" class="text-white hover:text-blue-600 font-semibold">AZ</a>
            <a href="#" class="text-white hover:text-blue-600 font-semibold">RU</a>
            <a href="#" class="text-white hover:text-blue-600 font-semibold">EN</a>
        </div>
    </header>
    
    <!-- Services Section -->
    <section class="bg-white p-6 shadow-md">
        <div class="grid sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10 text-center">
            <div>
                <i class='bx bx-mobile-alt text-4xl text-blue-600'></i>
                <p class="mt-4 font-semibold">iPhone məlumatların bərpası</p>
            </div>
            <div>
                <i class='bx bx-chip text-4xl text-blue-600'></i>
                <p class="mt-4 font-semibold">SSD məlumatların bərpası</p>
            </div>
            <div>
                <i class='bx bx-hdd text-4xl text-blue-600'></i>
                <p class="mt-4 font-semibold">HDD məlumatların bərpası</p>
            </div>
            <div>
                <i class='bx bx-server text-4xl text-blue-600'></i>
                <p class="mt-4 font-semibold">RAID məlumatların bərpası</p>
            </div>
        </div>
    </section>
    
</body>
</html>
